events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Allow large file uploads (logos, product images, banners)
    client_max_body_size 25M;

    # DNS interno de Docker (127.0.0.11).
    #
    # Nginx resuelve los nombres de los upstreams UNA SOLA VEZ, al arrancar.
    # Cuando un deploy recrea `web` y `api` (que es lo que pasa siempre, porque
    # sus imagenes cambian), los contenedores nuevos reciben otras IPs y nginx
    # se queda apuntando a las viejas: los contenedores estan arriba pero el
    # sitio responde 502 hasta que se reinicia nginx a mano.
    #
    # Con `resolver` y variables en `proxy_pass`, nginx vuelve a resolver el
    # nombre en cada request (con la cache de `valid=10s`), asi que el sitio
    # aguanta un redeploy sin caerse.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 3200;
        server_name shopylinks.shop www.shopylinks.shop;

        # Next.js static assets — served forever-cached (content-addressed hashes)
        location /_next/static/ {
            set $web_upstream web:8191;
            proxy_pass http://$web_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Frontend
        location / {
            set $web_upstream web:8191;
            proxy_pass http://$web_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Backend API
        location /api {
            set $api_upstream api:3001;
            proxy_pass http://$api_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
