services:
  web:
    image: shopylink-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_FRONTEND_URL: ${FRONTEND_URL}
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - INTERNAL_API_URL=http://api:3001/api
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - shopynet

  api:
    image: shopylink-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    env_file:
      # Secretos que viven FUERA del repositorio (en el servidor) para que nunca
      # lleguen a git ni al panel de Dokploy. El archivo se crea una sola vez:
      #   cat > /etc/dokploy/secrets/shopylink.env << 'EOF'
      #   DATABASE_URL="postgresql://..."
      #   DATABASE_ENCRYPTION_KEY="<clave>"
      #   JWT_SECRET="<clave>"
      #   SUPABASE_KEY="<service_role_key>"
      #   EOF
      # `required: false` para que el compose siga siendo usable en entornos
      # donde ese archivo todavia no existe.
      - path: /etc/dokploy/secrets/shopylink.env
        required: false
    environment:
      # DATABASE_URL NO se inyecta desde el .env del stack: llega por `env_file`.
      - SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - PORT=3001
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    deploy:
      resources:
        limits:
          memory: 768M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3001/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - shopynet

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - shopynet

  nginx:
    image: shopylink-nginx:latest
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "3200:3200"
    restart: always
    depends_on:
      - web
      - api
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - shopynet

networks:
  shopynet:
    driver: bridge

volumes:
  redis_data:
