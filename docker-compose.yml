services:
  web:
    image: shopylink-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_FRONTEND_URL: ${FRONTEND_URL}
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      # NEXTAUTH_SECRET no se inyecta: el frontend usa Supabase Auth y ningun
      # codigo lee esa variable. Mantenerla solo dejaba el secreto expuesto.
      - INTERNAL_API_URL=http://api:3001/api
    networks:
      - shopynet

  api:
    image: shopylink-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    env_file:
      # Secretos que viven FUERA del repositorio (en el servidor) para que nunca
      # lleguen a git ni al panel de Dokploy. El archivo se crea una sola vez:
      #   cat > /etc/dokploy/secrets/shopylink.env <<'EOF'
      #   DATABASE_ENCRYPTION_KEY="<clave>"
      #   JWT_SECRET="<clave>"
      #   EOF
      # `required: false` para que el compose siga siendo usable en entornos
      # donde ese archivo todavia no existe.
      - path: /etc/dokploy/secrets/shopylink.env
        required: false
    environment:
      - DATABASE_URL=${DATABASE_URL}
      # JWT_SECRET NO se inyecta desde el .env del stack: llega por `env_file`,
      # para que la clave de firma no quede en el repositorio ni en Dokploy.
      - SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - PORT=3001
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    networks:
      - shopynet

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - shopynet

  nginx:
    image: shopylink-nginx:latest
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "3200:3200"
    restart: always
    depends_on:
      - web
      - api
    networks:
      - shopynet

networks:
  shopynet:
    driver: bridge

volumes:
  redis_data:
