services:
  web:
    image: shopylink-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_FRONTEND_URL: ${FRONTEND_URL}
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - INTERNAL_API_URL=http://api:3001/api
    networks:
      - shopynet

  migrate:
    # Own image tag on purpose: sharing "shopylink-api:latest" with the api
    # service would let the migrator image overwrite the API image and make the
    # API container start the migration command instead of the Nest server.
    image: shopylink-migrate:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrator
    restart: "no"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
    networks:
      - shopynet

  api:
    image: shopylink-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    depends_on:
      migrate:
        # service_started (NOT service_completed_successfully): with the strict
        # condition a failing migration container aborts the whole `compose up`
        # and takes the web + api containers down with it. Starting in parallel
        # keeps the site online; the migration is idempotent so it can safely
        # finish a moment later.
        condition: service_started
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - PORT=3001
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    networks:
      - shopynet

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - shopynet

  nginx:
    image: shopylink-nginx:latest
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "3200:3200"
    restart: always
    depends_on:
      - web
      - api
    networks:
      - shopynet

networks:
  shopynet:
    driver: bridge

volumes:
  redis_data:
