# Stack de ShopyLink.
#
# NOTA PARA EL DEPLOY: este archivo se despliega con
# `docker compose up -d --build --remove-orphans`, que construye las tres
# imagenes EN PARALELO. Cada una instala dependencias, asi que en un servidor
# con RAM justa los tres `npm ci` compiten y el build se queda sin memoria o
# sin salida en el log y Dokploy lo corta.
#
# Para que las imagenes se construyan de una en una, agrega esta variable al
# entorno de la aplicacion en Dokploy (panel -> Environment):
#
#   COMPOSE_PARALLEL_LIMIT=1
#
# Compose la lee del .env que genera el propio Dokploy y la pasa a buildx
# como limite de jobs. Requiere buildx 0.38 o superior; si el servidor tiene
# una version anterior, compose avisa e ignora el limite.
services:
  web:
    image: shopylink-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_FRONTEND_URL: ${FRONTEND_URL}
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - INTERNAL_API_URL=http://api:3001/api
    deploy:
      resources:
        limits:
          # El render de la imagen OG (1200x630) y el SSR cargan mas que un
          # Next.js normal: con 512M el contenedor moria por OOM y la ruta
          # de compartir caia justo en el crawler.
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - shopynet

  api:
    image: shopylink-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    env_file:
      # Secretos que viven FUERA del repositorio (en el servidor) para que nunca
      # lleguen a git ni al panel de Dokploy. El archivo se crea una sola vez:
      #   cat > /etc/dokploy/secrets/shopylink.env << 'EOF'
      #   DATABASE_URL="postgresql://..."
      #   DATABASE_ENCRYPTION_KEY="<clave>"
      #   JWT_SECRET="<clave>"
      #   SUPABASE_KEY="<service_role_key>"
      #   EOF
      # `required: false` para que el compose siga siendo usable en entornos
      # donde ese archivo todavia no existe.
      - path: /etc/dokploy/secrets/shopylink.env
        required: false
    environment:
      # DATABASE_URL NO se inyecta desde el .env del stack: llega por `env_file`.
      - SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - PORT=3001
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    deploy:
      resources:
        limits:
          # Sharp procesa imagenes de hasta 20MB en memoria: con 768M el
          # contenedor se llevaba por delante una subida de catalogo.
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # Chequeo de vida del proceso (siempre 200). Con start_period amplio
      # porque la API tarda en levantar Prisma y Redis.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3001/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - shopynet

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - shopynet

  nginx:
    image: shopylink-nginx:latest
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "3200:3200"
    restart: always
    depends_on:
      - web
      - api
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - shopynet

networks:
  shopynet:
    driver: bridge

volumes:
  redis_data:
